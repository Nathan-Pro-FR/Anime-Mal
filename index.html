<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAL Explorer</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <header>
      <h1>MAL<span>Explorer</span></h1>
      <p>Top Animes de la saison en direct de MyAnimeList</p>
    </header>

    <section class="search-bar">
      <input type="text" id="filterInput" placeholder="Filtrer les animes affichés...">
    </section>

    <div id="status" class="status">Chargement des données...</div>

    <main id="resultsGrid" class="grid"></main>
  </div>

  <script src="script.js"></script>
</body>
</html>
